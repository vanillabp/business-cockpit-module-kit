<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>bc-module-host test page</title>
  <style>
    /* The page's own styles must not reach into a module's shadow DOM (EXT-005). */
    p, button { color: rgb(0, 0, 255); }
    main { display: flex; gap: 2rem; }
  </style>
  <script type="module" src="/host.js"></script>
</head>
<body>
  <p id="outside">This text belongs to the page.</p>
  <header id="header"></header>
  <main>
    <section id="react-page"><div data-bc-area="body"></div><div data-bc-area="actions"></div></section>
    <section id="vue-page"><div data-bc-area="body"></div><div data-bc-area="actions"></div></section>
    <section id="react-all"></section>
    <section id="vue-all"></section>
    <section id="slow-page"></section>
  </main>
</body>
</html>
